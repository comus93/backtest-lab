[project]
name = "backtest-lab"
version = "0.1.0"
description = "Small backtest runtime for free-form Python strategies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ffn>=1.1.2",
    "finance-datareader>=0.9.100",
    "pandas>=2.2.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.1",
    "yfinance>=0.2.0",
]

[project.scripts]
backtest-lab-sample = "backtest_lab.sample:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
