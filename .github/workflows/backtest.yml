name: Backtest Request

on:
  push:
    branches:
      - main
    paths:
      - automation/backtest-request.json

permissions:
  contents: write

concurrency:
  group: backtest-request-main
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run full pytest suite
        run: pytest -q

      - name: Execute registered backtest request
        run: python -m backtest_lab.automation automation/backtest-request.json

      - name: Verify result manifest
        run: |
          test -f automation/backtest-result.md
          test -n "$(find runs -name input_prices.csv -type f -newer automation/backtest-request.json -print -quit)"

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs automation/backtest-result.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 1
          fi
          REQUEST_ID=$(python -c 'import json; print(json.load(open("automation/backtest-request.json", encoding="utf-8"))["request_id"])')
          git commit -m "Run backtest request ${REQUEST_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
