name: Publish BTLab Research Reports

on:
  push:
    branches: [main]
    paths:
      - 'src/backtest_lab/reporting/**'
      - 'tests/test_psar_reporting.py'
      - 'tests/test_reporting_golden.py'
      - 'tests/test_reporting_common.py'
      - 'tests/fixtures/reporting/**'
      - 'pyproject.toml'
      - 'src/backtest_lab/strategies/multi_asset_weekly_sma/**'
      - 'src/backtest_lab/reporting/multi_asset_weekly_sma_report.py'
      - 'src/backtest_lab/reporting/adapters/multi_asset_weekly_sma.py'
      - 'runs/multi_asset_weekly_sma/**'
      - 'runs/gold_trend_research/**'
      - 'src/backtest_lab/strategies/gold_trend_research/**'
      - 'tests/strategies/gold_trend_research/**'
      - 'tests/test_multi_asset_weekly_sma_reporting.py'
      - 'tests/test_selectable_trade_charts.py'
      - 'tests/test_chart_composer.py'
      - 'tests/test_research_index.py'
      - 'doc/strategies/**'
      - 'runs/**'
      - '.github/workflows/publish-psar-report.yml'
  workflow_dispatch:

concurrency:
  group: psar-report-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[report,dev]"

      - name: Validate archived data and report renderer
        run: python -m pytest -q tests/test_psar_reporting.py tests/test_reporting_golden.py tests/test_reporting_common.py

      - name: Validate SMA report integration
        run: python -m pytest -q tests/strategies/multi_asset_weekly_sma tests/test_multi_asset_weekly_sma_reporting.py tests/test_selectable_trade_charts.py

      - name: Validate gold-only research
        run: python -m pytest -q tests/strategies/gold_trend_research tests/test_chart_composer.py tests/test_research_index.py

      - name: Build standalone static HTML
        run: |
          python -m backtest_lab.reporting.psar_report \
            --run runs/psar_segment_duration/r01/20261103-0002 \
            --output _site/research/psar_segment_duration/index.html
          test -s _site/research/psar_segment_duration/index.html

      - name: Build multi-asset report if a successful run is archived
        shell: bash
        run: |
          # The root is generated as the research index after all reports.
          if test -d runs/multi_asset_weekly_sma/r01; then
            latest=$(find runs/multi_asset_weekly_sma/r01 -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
            if test -n "$latest" && test -f "$latest/asset_manifest.csv"; then
              python -m backtest_lab.reporting.multi_asset_weekly_sma_report --run "$latest" --output _site/research/multi_asset_weekly_sma
              test -s _site/research/multi_asset_weekly_sma/index.html
            else
              echo "No complete SMA archive yet; publishing PSAR only."
            fi
          else
            echo "No multi-asset study run yet; publishing PSAR only."
          fi

      - name: Publish pinned multi-asset baseline archive
        run: |
          python -m backtest_lab.reporting.multi_asset_weekly_sma_report \
            --run runs/multi_asset_weekly_sma/r01/20261127-0008 \
            --output _site/research/archive/multi_asset_weekly_sma/r01/20261127-0008
          test -s _site/research/archive/multi_asset_weekly_sma/r01/20261127-0008/index.html

      - name: Build independent gold research report
        shell: bash
        run: |
          if test -d runs/gold_trend_research/r01; then
            # Select the latest complete trend report, not a narrower sensitivity run.
            latest=""
            for candidate in $(find runs/gold_trend_research/r01 -mindepth 1 -maxdepth 1 -type d | sort -r); do
              if test -f "$candidate/heikin_ashi_signals.csv" || test -f "$candidate/assets/gold/heikin_ashi_signals.csv"; then
                latest="$candidate"
                break
              fi
            done
            if test -n "$latest"; then
              python -m backtest_lab.reporting.gold_trend_research_report --run "$latest" --output _site/research/gold_trend_research --site
              test -s _site/research/gold_trend_research/index.html
            fi
          fi

      - name: Build research index
        run: python -m backtest_lab.reporting.research_index --repo . --site _site

      - name: Upload HTML preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: psar-report-html
          path: _site
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy static report
        id: deployment
        uses: actions/deploy-pages@v4
