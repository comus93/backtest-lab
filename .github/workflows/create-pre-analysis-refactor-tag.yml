name: Create pre-analysis refactor tag

on:
  push:
    paths:
      - '.github/workflows/create-pre-analysis-refactor-tag.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create annotated pre-refactor tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="pre-analysis-package-refactor-20260908"
          TARGET="1d8fdf57155b8e6e54f13f6aaa0896d8dd5bfb80"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi
          git tag -a "$TAG" "$TARGET" -m "Before analysis package refactor"
          git push origin "$TAG"
