name: Extract US Market Cap CAGR Matrices

on:
  push:
    paths:
      - '.github/workflows/extract-us-market-cap-cagr-matrices.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pivot existing window results
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          run_dir = Path('runs/us_market_cap_leaders/r01/20260908-0002')
          source = run_dir / 'window_performance.csv'

          with source.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))

          def truthy(value: str) -> bool:
              return value.strip().lower() in {'true', '1', 'yes'}

          def write_matrix(strategy: str, filename: str) -> None:
              selected = [
                  row for row in rows
                  if truthy(row['matrix_eligible']) and row['strategy'] == strategy
              ]
              starts = sorted({row['start_date'] for row in selected})
              ends = sorted({row['end_date'] for row in selected})
              values = {
                  (row['start_date'], row['end_date']): float(row['excess_cagr_vs_qqq']) * 100.0
                  for row in selected
              }
              out = run_dir / filename
              with out.open('w', newline='', encoding='utf-8') as f:
                  writer = csv.writer(f)
                  writer.writerow(['start_date'] + ends)
                  for start in starts:
                      writer.writerow([
                          start,
                          *[
                              '' if (start, end) not in values else f"{values[(start, end)]:.4f}"
                              for end in ends
                          ],
                      ])

          write_matrix('TOP1', 'top1_cagr_minus_qqq_matrix.csv')
          write_matrix('TOP2', 'top2_cagr_minus_qqq_matrix.csv')
          PY

      - name: Commit matrices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/us_market_cap_leaders/r01/20260908-0002/top1_cagr_minus_qqq_matrix.csv
          git add runs/us_market_cap_leaders/r01/20260908-0002/top2_cagr_minus_qqq_matrix.csv
          git commit -m "Add QQQ CAGR start-end matrices"
          git pull --rebase origin main
          git push origin HEAD:main
